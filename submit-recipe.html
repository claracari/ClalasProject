<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Recipe</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navigation Bar -->
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-orange-600">🍳 RecipeShare</h1>
            <nav class="space-x-4">
                <a href="browse.html" class="text-gray-600 hover:text-orange-600">Browse Recipes</a>
                <a href="submit-recipe.html" class="text-orange-600 font-semibold">Submit Recipe</a>
            </nav>
        </div>
    </header>

    <!-- Main Content / Form Section -->
    <main class="max-w-2xl mx-auto px-4 py-8">
        <div class="bg-white p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-6 text-gray-900">Share Your Recipe</h2>
            
            <form action="#" method="POST" class="space-y-6">
                <!-- Recipe Title -->
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Recipe Title</label>
                    <input type="text" id="title" name="title" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-orange-500 focus:border-orange-500"
                        placeholder="e.g., Homemade Chocolate Chip Cookies">
                </div>

                <!-- Description -->
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Short Description</label>
                    <textarea id="description" name="description" rows="3" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-orange-500 focus:border-orange-500"
                        placeholder="Briefly describe your dish..."></textarea>
                </div>

                <!-- Category & Prep Time (Grid) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                        <select id="category" name="category" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-orange-500 focus:border-orange-500">
                            <option value="dessert">Dessert</option>
                            <option value="dinner">Dinner</option>
                            <option value="breakfast">Breakfast</option>
                            <option value="snack">Snack</option>
                        </select>
                    </div>
                    <div>
                        <label for="prep-time" class="block text-sm font-medium text-gray-700 mb-1">Prep Time (minutes)</label>
                        <input type="number" id="prep-time" name="prep-time" min="1" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-orange-500 focus:border-orange-500"
                            placeholder="30">
                    </div>
                </div>

                <!-- Ingredients -->
                <div>
                    <label for="ingredients" class="block text-sm font-medium text-gray-700 mb-1">Ingredients (one per line)</label>
                    <textarea id="ingredients" name="ingredients" rows="4" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-orange-500 focus:border-orange-500"
                        placeholder="2 cups flour&#10;1 tsp baking soda&#10;..."></textarea>
                </div>

                <!-- Instructions -->
                <div>
                    <label for="instructions" class="block text-sm font-medium text-gray-700 mb-1">Instructions</label>
                    <textarea id="instructions" name="instructions" rows="5" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-orange-500 focus:border-orange-500"
                        placeholder="Step 1: Preheat oven to 350°F..."></textarea>
                </div>

                <!-- Submit Button -->
                <div>
                    <button type="submit" 
                        class="w-full bg-orange-600 text-white py-3 px-4 rounded-md font-semibold hover:bg-orange-700 transition duration-200">
                        Publish Recipe
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
