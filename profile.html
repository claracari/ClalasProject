<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - RecipeApp</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">🍳 RecipeApp</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="submit-recipe.html">Add Recipe</a></li>
                <li><a href="login.html" class="logout-btn">Log Out</a></li>
            </ul>
        </nav>
    </header>

    <main class="profile-container">
        <div class="profile-header">
            <img src="images/avatar-placeholder.png" alt="User Avatar" class="avatar">
            <div>
                <h2>Jane Doe</h2>
                <p>Food enthusiast & amateur baker</p>
            </div>
        </div>

        <section class="saved-recipes">
            <h3>My Saved Recipes</h3>
            <div class="recipe-grid">
                <!-- Example Card -->
                <div class="recipe-card">
                    <h4>Chocolate Chip Cookies</h4>
                    <a href="recipe.html" class="btn-secondary">View Recipe</a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
