<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1 class="logo">🍳 Chef's Notebook</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="recipes.html">Recipes</a></li>
                <li><a href="submit.html">Upload Recipe</a></li>
                <li><a href="login.html" class="btn-login active">Login / Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-container auth-form">
            <h2>Create an Account</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-match-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                        <span id="matchIndicator" class="match-dot"></span>
                    </div>
                </div>

                <div id="signupError" class="error-message" style="display: none;"></div>

                <button type="submit" id="submitBtn" class="btn-primary full-width" disabled>Create Account</button>
            </form>

            <div class="auth-links">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Chef's Notebook.</p>
    </footer>

    <script>
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const matchIndicator = document.getElementById('matchIndicator');
        const submitBtn = document.getElementById('submitBtn');
        const errorDiv = document.getElementById('signupError');

        function validatePasswords() {
            const pass = passwordInput.value;
            const confirmPass = confirmInput.value;

            if (pass === '' && confirmPass === '') {
                matchIndicator.className = 'match-dot';
                submitBtn.disabled = true;
                submitBtn.classList.remove('enabled');
                return;
            }

            if (pass === confirmPass) {
                matchIndicator.className = 'match-dot green';
                submitBtn.disabled = false;
                submitBtn.classList.add('enabled');
                errorDiv.style.display = 'none';
            } else {
                matchIndicator.className = 'match-dot red';
                submitBtn.disabled = true;
                submitBtn.classList.remove('enabled');
            }
        }

        passwordInput.addEventListener('input', validatePasswords);
        confirmInput.addEventListener('input', validatePasswords);

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;

            let users = JSON.parse(localStorage.getItem('recipe_users')) || [];
            
            // Check if user already exists
            if (users.some(u => u.email === email)) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'An account with this email already exists.';
                return;
            }

            // Save new user
            users.push({ email, password });
            localStorage.setItem('recipe_users', JSON.stringify(users));

            alert('Account created successfully! You can now log in.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
