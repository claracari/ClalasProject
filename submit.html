<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book - Upload Recipe</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (!localStorage.getItem('currentUser')) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <header>
        <nav class="navbar">
            <h1 class="logo">🍳 Chef's Notebook</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="recipes.html">Recipes</a></li>
                <li><a href="submit.html" class="active">Upload Recipe</a></li>
                <li><button onclick="logout()" class="btn-logout">Logout</button></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Share Your Recipe</h2>
            <form>
                <div class="form-group">
                    <label for="title">Recipe Title</label>
                    <input type="text" id="title" name="title" placeholder="e.g., Creamy Garlic Pasta" required>
                </div>

                <div class="form-group">
                    <label for="image">Image URL</label>
                    <input type="url" id="image" name="image" placeholder="https://example.com/photo.jpg">
                </div>

                <div class="form-group">
                    <label for="ingredients">Ingredients (one per line)</label>
                    <textarea id="ingredients" name="ingredients" rows="5" placeholder="1 cup flour&#10;2 eggs&#10;1/2 tsp salt" required></textarea>
                </div>

                <div class="form-group">
                    <label for="instructions">Instructions</label>
                    <textarea id="instructions" name="instructions" rows="6" placeholder="Step 1: Mix ingredients..." required></textarea>
                </div>

                <button type="submit" class="btn-primary">Publish Recipe</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Chef's Notebook.</p>
    </footer>

    <script>
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
