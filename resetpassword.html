<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book - Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1 class="logo">🍳 Chef's Notebook</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="recipes.html">Recipes</a></li>
                <li><a href="submit.html">Upload Recipe</a></li>
                <li><a href="login.html" class="btn-login active">Login / Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-container auth-form">
            <h2>Reset Password</h2>
            <p class="reset-desc">Enter your email address and we'll help you update your password.</p>
            
            <form id="resetForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group" id="newPassGroup" style="display: none;">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="••••••••">
                </div>

                <div id="resetMessage" class="error-message" style="display: none;"></div>

                <button type="submit" id="resetBtn" class="btn-primary full-width">Continue</button>
            </form>

            <div class="auth-links">
                <p>Remembered your password? <a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Chef's Notebook.</p>
    </footer>

    <script>
        const resetForm = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const newPassGroup = document.getElementById('newPassGroup');
        const newPasswordInput = document.getElementById('newPassword');
        const resetMessage = document.getElementById('resetMessage');
        const resetBtn = document.getElementById('resetBtn');

        let step = 1; // Step 1: verify email, Step 2: enter new password
        let targetEmail = '';

        resetForm.addEventListener('submit', function(e) {
            e.preventDefault();
            let users = JSON.parse(localStorage.getItem('recipe_users')) || [];

            if (step === 1) {
                targetEmail = emailInput.value.trim();
                const userExists = users.some(u => u.email === targetEmail);

                if (userExists) {
                    resetMessage.style.display = 'none';
                    emailInput.disabled = true;
                    newPassGroup.style.display = 'block';
                    newPasswordInput.required = true;
                    resetBtn.textContent = 'Update Password';
                    step = 2;
                } else {
                    resetMessage.style.display = 'block';
                    resetMessage.textContent = 'No account found with this email address.';
                }
            } else {
                const newPass = newPasswordInput.value;
                if (!newPass) return;

                // Update user password in localStorage
                users = users.map(u => {
                    if (u.email === targetEmail) {
                        u.password = newPass;
                    }
                    return u;
                });

                localStorage.setItem('recipe_users', JSON.stringify(users));
                alert('Your password has been successfully reset! Please log in with your new password.');
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
